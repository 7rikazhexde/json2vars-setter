name: Generate composer.lock (PHP example)

# Why this exists:
# examples/php has no committed composer.lock. Without one, Dependabot cannot
# treat `composer` like the other lockfile-based ecosystems here (npm, bundler,
# cargo, ...): instead of a normal version-bump PR, it proposes "update the
# requirement to permit the latest version" PRs, and those bypass this repo's
# `ignore: update-types: [version-update:semver-major]` rule for composer in
# .github/dependabot.yml (seen twice: #706, #708 - both a phpunit ^11.0 -> ^13.4
# major bump that needs php >= 8.4.1, while examples/php's test matrix still
# covers 8.2/8.3). Committing composer.lock fixes that at the root.
#
# PHP/composer aren't available in the local dev environment, so this runs on
# a Linux runner and opens a reviewable PR (mirrors refresh-data-files.yml),
# using PAT_FOR_PUSHES so the PR's own CI actually runs.
#
# composer.json's config.platform.php is pinned to 8.2 (this example's floor,
# see examples/php/php_project_matrix.json) so the lock it generates - and any
# future `composer update` Dependabot performs against it - only ever resolves
# package versions that actually support every PHP version in the test matrix,
# not just whichever PHP this workflow happens to run with.

on:
  workflow_dispatch:

concurrency:
  group: generate-composer-lock
  cancel-in-progress: true

# The job writes through PAT_FOR_PUSHES; GITHUB_TOKEN itself needs no extra scopes.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Skip quietly on a fork / when the PAT is absent, instead of failing the
      # run (mirrors dependabot-auto-rebase.yml / refresh-data-files.yml).
      - name: Check that PAT_FOR_PUSHES is configured
        id: check
        env:
          PAT: ${{ secrets.PAT_FOR_PUSHES }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "PAT_FOR_PUSHES is not set; skipping."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout repository
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the PAT so the branch we push opens a PR whose CI actually runs
          # (a GITHUB_TOKEN push does not trigger downstream workflows).
          token: ${{ secrets.PAT_FOR_PUSHES }}

      - name: Set up PHP
        if: steps.check.outputs.configured == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer

      - name: composer update
        if: steps.check.outputs.configured == 'true'
        working-directory: examples/php
        run: composer update --no-interaction --no-progress

      - name: Open a PR if composer.lock changed
        if: steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_PUSHES }}
        run: |
          if [ -z "$(git status --porcelain examples/php/composer.lock)" ]; then
            echo "composer.lock is already up to date; nothing to do."
            exit 0
          fi

          branch="chore/generate-composer-lock-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add examples/php/composer.lock
          git commit -m ":heavy_plus_sign: chore(php): generate composer.lock"
          git push --set-upstream origin "${branch}"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title ":heavy_plus_sign: chore(php): generate composer.lock" \
            --body "Generated by the \`Generate composer.lock\` workflow, resolved against the \`config.platform.php\` floor (8.2) in \`examples/php/composer.json\`. Lets Dependabot treat \`composer\` like the other lockfile-based ecosystems in this repo, so the \`ignore: update-types: [version-update:semver-major]\` rule in \`.github/dependabot.yml\` actually applies (see #706 / #708).

            🤖 Generated with [Claude Code](https://claude.com/claude-code)"
